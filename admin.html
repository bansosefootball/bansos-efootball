<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BANSOS E-FOOTBALL — Admin Testimoni</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#071329;margin:0}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.box{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin-bottom:18px}input,button,select{padding:11px;border-radius:10px;border:1px solid #dbe3ef;font:inherit}button{cursor:pointer}.primary{background:#062b78;color:#fff}.danger{background:#fee2e2}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.review{border:1px solid #e5eaf2;padding:16px;border-radius:14px;margin:12px 0}.review img{max-width:220px;max-height:180px;border-radius:10px;margin-top:10px}.muted{color:#64748b;font-size:13px}</style></head><body><div class="wrap"><h1>Admin Testimoni</h1><p class="muted">Moderasi testimoni BANSOS E-FOOTBALL.</p><div class="box" id="login"><h3>Login Admin</h3><div class="row"><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button class="primary" onclick="login()">LOGIN</button></div><p id="msg" class="muted"></p></div><div id="panel" hidden><div class="box row"><b>Daftar Testimoni</b><button onclick="load()">Refresh</button><button onclick="logout()">Logout</button></div><div id="list"></div></div></div><script>const SUPABASE_URL='https://damejdnamcdnyqiadabh.supabase.co',SUPABASE_ANON_KEY='sb_publishable_PdSgJXDWlvIse1XxKqSDuw_Q7_62uhZ',sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=error?error.message:'Login berhasil';if(!error){loginBox(false);load()}}function loginBox(v){document.getElementById('login').hidden=!v;document.getElementById('panel').hidden=v}async function logout(){await sb.auth.signOut();loginBox(true)}async function load(){const {data,error}=await sb.from('testimonials').select('*').order('created_at',{ascending:false});if(error){list.innerHTML='<p>'+error.message+'</p>';return}list.innerHTML=data.map(x=>`<article class="review"><b>${esc(x.name)}</b> · ${esc(x.service)} · ${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}<p>${esc(x.message)}</p><p class="muted">Status: ${x.status}</p>${x.image_url?`<img src="${esc(x.image_url)}">`:''}<div class="row"><button class="primary" onclick="setStatus('${x.id}','approved')">Approve</button><button onclick="setStatus('${x.id}','rejected')">Reject</button><button class="danger" onclick="del('${x.id}')">Hapus</button></div></article>`).join('')||'<p>Belum ada data.</p>'}async function setStatus(id,status){const {error}=await sb.from('testimonials').update({status}).eq('id',id);if(error)alert(error.message);else load()}async function del(id){if(!confirm('Hapus testimoni ini?'))return;const {error}=await sb.from('testimonials').delete().eq('id',id);if(error)alert(error.message);else load()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}sb.auth.getSession().then(({data})=>{if(data.session){loginBox(false);load()}})</script></body></html>
